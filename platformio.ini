;     adafruit/Adafruit GFX Library@^1.12.5
;     adafruit/Adafruit ILI9341@^1.6.3

; ── FenceMate v2 — Geeetech GT2560 Rev A (ATmega2560) ─────────────────────────
[env:gt2560]
platform = atmelavr
board = megaatmega1280
framework = arduino
monitor_speed = 115200
; Exclude legacy v1 source — kept for reference only
build_src_filter = +<*> -<FenceMate_V1.01.ino> -<Arrow.cpp> -<D7_80_NP.cpp>
lib_deps =
    waspinator/AccelStepper@^1.64
    olikraus/U8g2@^2.35.9
    mathertel/RotaryEncoder@^1.5.3
